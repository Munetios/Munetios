<svg xmlns="http://www.w3.org/2000/svg">
  <defs>
    <filter
      id="backdrop-wave"
      x="-4%"
      y="-4%"
      width="108%"
      height="108%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.006 0.004"
        numOctaves="1"
        seed="7"
        result="refractionNoise"
      />
      <feGaussianBlur
        in="refractionNoise"
        stdDeviation="12"
        result="smoothRefraction"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="smoothRefraction"
        scale="8"
        xChannelSelector="R"
        yChannelSelector="B"
      />
    </filter>

    <filter
      id="backdrop-scroll-low"
      x="-4%"
      y="-6%"
      width="108%"
      height="112%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.003 0.009"
        numOctaves="1"
        seed="11"
        result="scrollNoise"
      />
      <feGaussianBlur
        in="scrollNoise"
        stdDeviation="14"
        result="smoothScrollNoise"
      />
      <feColorMatrix
        in="smoothScrollNoise"
        type="matrix"
        values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 1 0 0  0 0 0 1 0"
        result="verticalRefraction"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="verticalRefraction"
        scale="12"
        xChannelSelector="R"
        yChannelSelector="B"
      />
    </filter>

    <filter
      id="backdrop-scroll-medium"
      x="-4%"
      y="-8%"
      width="108%"
      height="116%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.003 0.007"
        numOctaves="1"
        seed="11"
        result="scrollNoise"
      />
      <feGaussianBlur
        in="scrollNoise"
        stdDeviation="15"
        result="smoothScrollNoise"
      />
      <feColorMatrix
        in="smoothScrollNoise"
        type="matrix"
        values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 1 0 0  0 0 0 1 0"
        result="verticalRefraction"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="verticalRefraction"
        scale="18"
        xChannelSelector="R"
        yChannelSelector="B"
      />
    </filter>

    <filter
      id="backdrop-scroll-high"
      x="-4%"
      y="-11%"
      width="108%"
      height="122%"
      color-interpolation-filters="sRGB"
    >
      <feTurbulence
        type="fractalNoise"
        baseFrequency="0.003 0.005"
        numOctaves="1"
        seed="11"
        result="scrollNoise"
      />
      <feGaussianBlur
        in="scrollNoise"
        stdDeviation="16"
        result="smoothScrollNoise"
      />
      <feColorMatrix
        in="smoothScrollNoise"
        type="matrix"
        values="0 0 0 0 0.5  0 0 0 0 0.5  0 0 1 0 0  0 0 0 1 0"
        result="verticalRefraction"
      />
      <feDisplacementMap
        in="SourceGraphic"
        in2="verticalRefraction"
        scale="25"
        xChannelSelector="R"
        yChannelSelector="B"
      />
    </filter>
  </defs>
</svg>
