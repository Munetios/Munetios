<!doctype html>
<html lang="en">
  <head>
    <meta charset="UTF-8" />
    <meta name="viewport" content="width=device-width, initial-scale=1.0" />
    <title>Munetios</title>
    <link
      rel="stylesheet"
      href="https://api.munetios.com/beautiful-css/beautiful.css"
    />
    <style>
      :root {
        color-scheme: dark;
        --background: #14081f;
        --foreground: #f7f2ff;
        --panel: rgba(43, 18, 68, 0.66);
        --line: rgba(226, 212, 255, 0.18);
      }

      * {
        box-sizing: border-box;
      }

      html,
      body {
        min-height: 100%;
      }

      body {
        margin: 0;
        background:
          radial-gradient(
            circle at 16% 12%,
            rgba(157, 108, 255, 0.26),
            transparent 26rem
          ),
          linear-gradient(145deg, #10071c 0%, #28123f 54%, #150a23 100%);
        color: var(--foreground);
        font-family:
          "Google Sans Flex",
          "Google Sans",
          Inter,
          ui-sans-serif,
          system-ui,
          -apple-system,
          BlinkMacSystemFont,
          "Segoe UI",
          sans-serif;
      }

      .liquid-glass {
        background: var(--panel);
        border: 1px solid var(--line);
        box-shadow: 0 18px 60px rgba(7, 2, 17, 0.36);
        backdrop-filter: blur(3px) saturate(1.22);
        -webkit-backdrop-filter: blur(3px) saturate(1.22);
      }

      munetios-app {
        display: block;
        min-height: 100dvh;
        padding: clamp(0.75rem, 2vw, 1rem);
      }

      .munetios-app-render {
        min-height: calc(100dvh - clamp(1.5rem, 4vw, 2rem));
        border-radius: 8px;
        background:
          radial-gradient(
            circle at 16% 12%,
            rgba(157, 108, 255, 0.26),
            transparent 26rem
          ),
          linear-gradient(145deg, #10071c 0%, #28123f 54%, #150a23 100%);
      }
    </style>
  </head>
  <body>
    <munetios-app id="munetiosApp"></munetios-app>

    <template id="munetiosAppTemplate">
      <main
        class="munetios-app-render liquid-glass"
        data-munetios-app-render="true"
        data-translate-aria-label="landingAriaLabel"
        aria-label="Munetios app render"
      ></main>
    </template>

    <script type="module">
      class MunetiosApp extends HTMLElement {
        connectedCallback() {
          if (this.querySelector("[data-munetios-app-render='true']")) {
            return;
          }

          const template = document.getElementById("munetiosAppTemplate");
          this.append(template.content.cloneNode(true));
        }
      }

      if (!customElements.get("munetios-app")) {
        customElements.define("munetios-app", MunetiosApp);
      }
      console.log(
        "Warning: Do not paste any code into the console as it poses a security risk and may allow attackers to access your account. Please review any code before pasting.",
      );
    </script>
  </body>
</html>
