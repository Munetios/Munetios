name = "munetios"
main = "worker.mjs"
compatibility_date = "2026-11-20"
workers_dev = false
preview_urls = false

[[routes]]
pattern = "beta.munetios.com"
custom_domain = true

[[routes]]
pattern = "accounts.munetios.com/*"
zone_name = "munetios.com"

[[routes]]
pattern = "write.munetios.com/*"
zone_name = "munetios.com"

[[routes]]
pattern = "calendar.munetios.com/*"
zone_name = "munetios.com"

[[routes]]
pattern = "photos.munetios.com/*"
zone_name = "munetios.com"

[[routes]]
pattern = "notes.munetios.com/*"
zone_name = "munetios.com"

[[routes]]
pattern = "tasks.munetios.com/*"
zone_name = "munetios.com"

[[routes]]
pattern = "weather.munetios.com/*"
zone_name = "munetios.com"

[[routes]]
pattern = "maps.munetios.com/*"
zone_name = "munetios.com"

[[routes]]
pattern = "webfilter.munetios.com"
custom_domain = true

[observability]
enabled = false

[[services]]
binding = "BETA_BACKEND"
service = "munetios-developer-beta-db"

[[services]]
binding = "MAIL_API"
service = "munetios-mail"

[[durable_objects.bindings]]
name = "WEATHER_RATE_LIMITER"
class_name = "WeatherRateLimiter"

[[durable_objects.bindings]]
name = "MAPS_TRAFFIC"
class_name = "MapsTraffic"

[[migrations]]
tag = "weather-rate-limit-v1"
new_sqlite_classes = ["WeatherRateLimiter"]

[[migrations]]
tag = "maps-traffic-v1"
new_sqlite_classes = ["MapsTraffic"]

[assets]
directory = "./assets"
binding = "ASSETS"
html_handling = "auto-trailing-slash"
run_worker_first = ["/", "/index.html", "/api", "/api/*", "/account", "/account/", "/account/index.html", "/mail", "/mail/", "/mail/index.html", "/weather", "/weather/", "/weather/index.html", "/webfilter", "/webfilter/", "/webfilter/index.html"]
